<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145b3d">
  <title>Solitaire</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #145b3d; color: #fff; font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; }
    #status p { max-width: 36em; }
    a { color: #ffe09a; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Solitaire game board"></canvas>
  <div id="status" role="status"><p>Loading Solitaire…</p></div>
  <noscript>This game requires JavaScript and WebAssembly.</noscript>
  <script type="module">
    const status = document.getElementById('status');
    function fail(message, offerNewGame = true) {
      status.replaceChildren();
      const text = document.createElement('p');
      text.textContent = message;
      status.append(text);
      if (!offerNewGame) return;
      const fresh = document.createElement('a');
      fresh.href = location.pathname + location.search;
      fresh.textContent = 'Start a new game';
      status.append(fresh);
    }
    function engineVersion() {
      const fragment = location.hash.slice(1);
      return fragment ? fragment.split(':', 1)[0] : 'v1';
    }
    function isMobileHost() {
      const agent = navigator.userAgent;
      // iPad Safari can identify as a Mac when requesting desktop pages.
      return navigator.userAgentData?.mobile === true
        || /Android|iPhone|iPad|iPod/i.test(agent)
        || (navigator.maxTouchPoints > 1
          && (/Macintosh/i.test(agent)
            || matchMedia('(pointer: coarse) and (hover: none)').matches));
    }
    const version = engineVersion();
    if (version !== 'v1') {
      fail('This game link uses an unsupported engine version. The link has been left unchanged.');
    } else {
      try {
        const requested = new URLSearchParams(location.search).get('renderer');
        if (requested && requested !== 'webgpu' && requested !== 'webgl2') {
          throw new Error('Unknown renderer. Use webgpu or webgl2.');
        }
        let backend = requested || 'webgl2';
        if (!requested && navigator.gpu) {
          try {
            if (await navigator.gpu.requestAdapter()) backend = 'webgpu';
          } catch { /* An exposed API does not guarantee an available adapter. */ }
        }
        async function start(backend) {
          const assetVersion = backend === 'webgpu'
            ? 'BUILD_ASSET_VERSION_WEBGPU' : 'BUILD_ASSET_VERSION_WEBGL2';
          const base = `./engines/v1/${backend}/patience_app`;
          const engine = await import(`${base}.js?v=${assetVersion}`);
          await engine.default({ module_or_path: new URL(`${base}_bg.wasm?v=${assetVersion}`, import.meta.url) });
          await engine.start(document.getElementById('game'), isMobileHost());
        }
        try {
          await start(backend);
        } catch (error) {
          if (requested || backend !== 'webgpu') throw error;
          console.warn('WebGPU startup failed; trying WebGL2.', error);
          // A canvas cannot switch context types after a renderer has claimed it.
          const canvas = document.getElementById('game');
          canvas.replaceWith(canvas.cloneNode(false));
          await start('webgl2');
        }
        status.remove();
        window.addEventListener('hashchange', () => {
          if (engineVersion() !== 'v1') location.reload();
        });
      } catch (error) {
        console.error(error);
        fail('The game could not start. Check your connection and that WebGL2 or WebGPU is available on this device.', false);
      }
    }
  </script>
</body>
</html>

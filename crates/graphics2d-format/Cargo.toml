[package]
name = "graphics2d-format"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
graphics2d = { version = "0.1.0", path = "../graphics2d" }
prost = "0.14"
pbjson = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"

[build-dependencies]
prost-build = "0.14"
pbjson-build = "0.9"
protoc-bin-vendored = "3"
